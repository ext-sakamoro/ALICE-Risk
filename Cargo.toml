[package]
name = "alice-risk"
version = "0.2.0"
edition = "2021"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
description = "Pre-trade risk checks, margin calculation, and circuit breakers"
license = "LicenseRef-Proprietary"
repository = "https://github.com/ext-sakamoro/ALICE-Risk"
keywords = ["risk", "pre-trade", "margin", "circuit-breaker", "finance"]
publish = false

[lib]
name = "alice_risk"
crate-type = ["rlib"]

[features]
default = ["std"]
std = []

[dependencies]
alice-ledger = { path = "../ALICE-Ledger" }
alice-sign = { version = "0.1", git = "https://github.com/ext-sakamoro/ALICE-Sign", rev = "6b79a0bad3db4c7de1719251d6a2a9405fbc0ee2" }

[dev-dependencies]
proptest = "1.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
