          }
          impl IntoIterator for AliceDB {
              type Item = (i64, f32);
              type IntoIter = std::vec::IntoIter<(i64, f32)>;
              fn into_iter(self) -> Self::IntoIter { vec![].into_iter() }
          }
          RUST
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --manifest-path ALICE-Risk/Cargo.toml --tests -- -W clippy::all -W clippy::pedantic -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

