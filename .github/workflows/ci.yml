name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: ALICE-Risk
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Ledger
          path: ALICE-Ledger
      - uses: actions/checkout@v5
        with:
          repository: ext-sakamoro/ALICE-Sync
          path: ALICE-Sync
      # alice-blockchain は **実 clone** する (stub にしない)
      # src が signature::{KeyPair, PublicKey, Signature} を無条件に使い、
      # tampered_*_breaks_verify 系の test が実 Ed25519 の検証に依存している
      # fake を置くと「暗号的に無効な test double」で CI が緑になる
      # (canonical 罠 #21、ALICE-Audit が 2026-09-15 に rich stub を廃止したのと同じ判断)
      # ALICE-Blockchain は private repo なので read-only deploy key で SSH clone する
      - name: Setup SSH for ALICE-Blockchain (private sibling)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ALICE_BLOCKCHAIN_DEPLOY_KEY }}
      - name: Clone ALICE-Blockchain (real sibling)
        run: git clone --depth 1 git@github.com:ext-sakamoro/ALICE-Blockchain.git ALICE-Blockchain
      - name: Create dependency stubs
        run: |
          for crate_info in \
            "ALICE-Physics:alice-physics" \
            "ALICE-Cache:alice-cache" \
            "ALICE-Auth:alice-auth" \
            "ALICE-Codec:alice-codec" \
            "ALICE-Analytics:alice-analytics" \
            "ALICE-Crypto:alice-crypto" \
            "ALICE-Zip/libalice:alice-zip"; do
            dir=$(echo "$crate_info" | cut -d: -f1)
            pkg=$(echo "$crate_info" | cut -d: -f2)
            mkdir -p "$dir/src"
            cat > "$dir/Cargo.toml" << TOML
          [package]
          name = "$pkg"
          version = "0.1.0"
          edition = "2021"
          [features]
          default = []
          std = []
          TOML
            echo "" > "$dir/src/lib.rs"
          done
          # alice-db stub: export AliceDB + Aggregation used by ALICE-Sync telemetry
          mkdir -p "ALICE-DB/src"
          cat > "ALICE-DB/Cargo.toml" << TOML
          [package]
          name = "alice-db"
          version = "0.1.0"
          edition = "2021"
          [features]
          default = []
          std = []
          [dependencies]
          TOML
          cat > "ALICE-DB/src/lib.rs" << 'RUST'
          use std::path::Path;
          use std::io;
          #[allow(dead_code)]
          pub enum Aggregation { None, Sum, Avg, Min, Max, Count, First, Last, StdDev, Variance }
          pub struct AliceDB;
          impl AliceDB {
              pub fn open<P: AsRef<Path>>(_p: P) -> io::Result<Self> { Ok(Self) }
              pub fn put(&self, _ts: i64, _v: f32) -> io::Result<()> { Ok(()) }
              pub fn put_batch(&self, _d: &[(i64, f32)]) -> io::Result<()> { Ok(()) }
              pub fn get(&self, _ts: i64) -> io::Result<Option<f32>> { Ok(None) }
              pub fn scan(&self, _s: i64, _e: i64) -> io::Result<Vec<(i64, f32)>> { Ok(vec![]) }
              pub fn aggregate(&self, _s: i64, _e: i64, _a: Aggregation) -> io::Result<f64> { Ok(0.0) }
              pub fn flush(&self) -> io::Result<()> { Ok(()) }
              pub fn close(self) -> io::Result<()> { Ok(()) }
          }
          impl IntoIterator for AliceDB {
              type Item = (i64, f32);
              type IntoIter = std::vec::IntoIter<(i64, f32)>;
              fn into_iter(self) -> Self::IntoIter { vec![].into_iter() }
          }
          RUST
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path ALICE-Risk/Cargo.toml

